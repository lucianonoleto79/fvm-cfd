# Publica a versão JavaScript (pasta web/) no GitHub Pages.
# Ative uma vez em Settings > Pages > Source: "GitHub Actions".
# Só manual: em repositório privado com conta gratuita o Pages não está disponível,
# e um disparo automático a cada push falharia.
name: pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
